# Starts the streaming job on Kubernetes: this Job runs spark-submit in cluster mode, which creates the
# Spark driver pod (order-events-streaming-*-driver) and the executor pod(s). The driver runs until you delete it.
apiVersion: batch/v1
kind: Job
metadata:
  name: streaming-submit
  namespace: orders
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      containers:
        - name: submit
          image: orders-pipeline:1.0
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - --master
            - k8s://https://kubernetes.default.svc
            - --deploy-mode
            - cluster
            - --name
            - order-events-streaming
            - --class
            - com.demo.OrderEventsStreaming
            - --conf
            - spark.kubernetes.namespace=orders
            - --conf
            - spark.kubernetes.container.image=orders-pipeline:1.0
            - --conf
            - spark.kubernetes.container.image.pullPolicy=IfNotPresent
            - --conf
            - spark.kubernetes.authenticate.driver.serviceAccountName=spark
            - --conf
            - spark.kubernetes.submission.waitAppCompletion=false
            - --conf
            - spark.executor.instances=1
            # executor was OOMKilled at the default 1g + 384Mi limit during batch 5
            - --conf
            - spark.executor.memory=2g
            - --conf
            - spark.executor.memoryOverhead=512m
            # shared volume for the Iceberg warehouse and the stream checkpoint
            - --conf
            - spark.kubernetes.driver.volumes.persistentVolumeClaim.data.options.claimName=iceberg-data
            - --conf
            - spark.kubernetes.driver.volumes.persistentVolumeClaim.data.mount.path=/data
            - --conf
            - spark.kubernetes.executor.volumes.persistentVolumeClaim.data.options.claimName=iceberg-data
            - --conf
            - spark.kubernetes.executor.volumes.persistentVolumeClaim.data.mount.path=/data
            # settings read by the Scala code
            - --conf
            - spark.kubernetes.driverEnv.KAFKA_BOOTSTRAP=kafka:9092
            - --conf
            - spark.kubernetes.driverEnv.KAFKA_TOPIC=retail
            - --conf
            - spark.kubernetes.driverEnv.WAREHOUSE=file:///data/iceberg/warehouse
            - --conf
            - spark.kubernetes.driverEnv.CHECKPOINT_DIR=file:///data/iceberg/checkpoints/order-events-pipeline
            - local:///opt/jars/orders-pipeline.jar
